<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc">
<title id="title">Lymphoma diagnostic and treatment pathway</title><desc id="desc">Obtain adequate tissue, classify lymphoma, stage and assess risk. Distinguish selected asymptomatic indolent disease from aggressive lymphoma; evaluate tumor lysis and CNS risk separately.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#082f49"/><stop offset="1" stop-color="#0f172a"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#67e8f9" stroke-width="2"/></marker></defs>
<rect width="1000" height="800" rx="30" fill="url(#bg)"/>
<g font-family="Arial, sans-serif" text-anchor="middle" fill="#f0fdfa"><text x="500" y="52" font-size="30" font-weight="700">LYMPHOMA: CLASSIFY BEFORE TREATING</text><text x="500" y="82" font-size="18" fill="#a5f3fc">Original IntMed teaching diagram · draft for teacher review</text></g>
<g fill="#164e63" stroke="#22d3ee" stroke-width="2"><rect x="270" y="110" width="460" height="68" rx="16"/><rect x="270" y="220" width="460" height="80" rx="16"/><rect x="270" y="340" width="460" height="68" rx="16"/></g>
<g font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#f0fdfa"><text x="500" y="151">Adequate tissue biopsy</text><text x="500" y="253">Histology + immunophenotype</text><text x="500" y="282" font-size="19">Add molecular tests when indicated</text><text x="500" y="382">Stage + symptoms + patient fitness</text></g>
<g fill="none" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)"><path d="M500 178V210"/><path d="M500 300V330"/><path d="M500 408V443H245V475"/><path d="M500 443H755V475"/></g>
<rect x="45" y="485" width="400" height="140" rx="20" fill="#134e4a" stroke="#5eead4" stroke-width="2"/><rect x="555" y="485" width="400" height="140" rx="20" fill="#4c1d3d" stroke="#f9a8d4" stroke-width="2"/>
<g font-family="Arial, sans-serif" text-anchor="middle" fill="#f0fdfa"><text x="245" y="523" font-size="24">Selected indolent disease</text><text x="245" y="559" font-size="20">Low burden + no symptoms:</text><text x="245" y="590" font-size="21">active observation may be suitable</text><text x="755" y="523" font-size="22">Aggressive / treatment-indicated</text><text x="755" y="559" font-size="20">Subtype- and stage-directed therapy</text><text x="755" y="590" font-size="20">Assess TLS and CNS risk separately</text></g>
<rect x="85" y="670" width="830" height="88" rx="18" fill="#0c4a6e" stroke="#38bdf8"/><g font-family="Arial, sans-serif" text-anchor="middle" fill="#e0f2fe"><text x="500" y="704" font-size="21">Rapid growth, new B symptoms or rising LDH?</text><text x="500" y="737" font-size="22" font-weight="700">Re-biopsy for possible transformation — do not assume the old subtype.</text></g>
</svg>
