<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" role="img" aria-labelledby="title desc">
  <title id="title">CLL: indications before treatment selection</title><desc id="desc">Original educational pathway. Confirm the diagnosis, evaluate disease activity and the cause of cytopenias, observe stable disease or select individualized therapy, and biopsy clinically suspicious transformation.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="none" stroke="#62e8c8" stroke-width="2"/></marker></defs>
  <rect width="960" height="800" rx="28" fill="#102a36"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="480" y="54" font-size="28" font-weight="bold" fill="#b5ffe9">CLL: first ask whether treatment is needed</text>
  <g fill="#174752" stroke="#62e8c8" stroke-width="2"><rect x="150" y="90" width="660" height="82" rx="18"/><rect x="150" y="220" width="660" height="100" rx="18"/><rect x="40" y="385" width="410" height="100" rx="18"/><rect x="510" y="385" width="410" height="100" rx="18"/><rect x="40" y="555" width="410" height="126" rx="18"/><rect x="510" y="555" width="410" height="126" rx="18"/></g>
  <g fill="#f2fffa" font-size="23"><text x="480" y="124">Confirm clinical context + clonal B-cell phenotype</text><text x="480" y="155" font-size="19">Smudge cells or a high WBC alone are not enough</text><text x="480" y="255">Assess symptoms, disease trajectory and cytopenias</text><text x="480" y="287" font-size="19">Marrow failure? Autoimmune destruction? Other cause?</text><text x="245" y="421">No active-treatment indication</text><text x="245" y="456" font-size="20">Planned observation and reassessment</text><text x="715" y="421">Active-treatment indication</text><text x="715" y="456" font-size="20">Individualized molecularly informed therapy</text><text x="245" y="590">Anemia with evidence of hemolysis</text><text x="245" y="626" font-size="20">Treat AIHA + provide necessary support</text><text x="245" y="658" font-size="18">Do not infer the cause from Hb alone</text><text x="715" y="590">Rapid asymmetric node growth</text><text x="715" y="626" font-size="20">Evaluate for Richter transformation</text><text x="715" y="658" font-size="18">PET guides biopsy; it does not replace tissue</text></g>
  <g stroke="#62e8c8" fill="none" stroke-width="3" marker-end="url(#arrow)"><path d="M480 172V214"/><path d="M480 320V350H245V379"/><path d="M480 350H715V379"/><path d="M245 485V514H480V535H245V549"/><path d="M715 485V514H480V535H715V549"/></g><text x="480" y="737" fill="#c3dedf" font-size="20">Reassess at each visit: new symptoms can change the pathway</text><text x="480" y="772" fill="#c3dedf" font-size="17">Original IntMed teaching diagram - draft for teacher review - not a prescribing protocol</text></g>
</svg>
