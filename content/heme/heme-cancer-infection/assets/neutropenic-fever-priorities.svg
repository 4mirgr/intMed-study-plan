<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690" role="img" aria-labelledby="title desc">
<title id="title">Febrile neutropenia: treatment and reassessment priorities</title><desc id="desc">An original educational decision map. Assess, culture and treat promptly, classify risk and reassess for bowel, lung, catheter and skin sources. Outpatient care requires all eligibility criteria and follow-up.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10283f"/><stop offset="1" stop-color="#23435d"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#6ce9df"/></marker></defs>
<rect width="1000" height="690" rx="28" fill="url(#bg)"/>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#f0ffff"><text x="500" y="48" font-size="29" font-weight="bold">Fever after cancer therapy: act, then reassess</text><text x="500" y="78" font-size="17" fill="#bedfe8">Original teaching map · Source-linked draft · No drug doses specified</text>
<rect x="120" y="110" width="760" height="85" rx="18" fill="#1b5266" stroke="#6ce9df" stroke-width="2"/><text x="500" y="144" font-size="23" font-weight="bold">Rapid assessment + cultures + prompt antipseudomonal therapy</text><text x="500" y="175" font-size="17">Do not delay treatment while awaiting investigations</text>
<path d="M500 195V240" stroke="#6ce9df" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="120" y="240" width="760" height="80" rx="18" fill="#1b5266" stroke="#6ce9df" stroke-width="2"/><text x="500" y="273" font-size="22" font-weight="bold">Assess clinical risk and ability to take oral treatment</text><text x="500" y="302" font-size="17">High risk / instability / poor oral intake → hospital pathway</text>
<path d="M500 320V365" stroke="#6ce9df" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="120" y="365" width="760" height="70" rx="18" fill="#1b5266" stroke="#6ce9df" stroke-width="2"/><text x="500" y="407" font-size="22" font-weight="bold">Persistent fever or new focal signs → targeted reassessment</text>
<g fill="#17394f" stroke="#65bcc7" stroke-width="2"><rect x="45" y="495" width="215" height="105" rx="15"/><rect x="280" y="495" width="205" height="105" rx="15"/><rect x="505" y="495" width="215" height="105" rx="15"/><rect x="740" y="495" width="215" height="105" rx="15"/></g>
<g stroke="#6ce9df" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M500 435V460H153V495"/><path d="M500 460H383V495"/><path d="M500 460H613V495"/><path d="M500 460H848V495"/></g>
<g font-size="20" font-weight="bold"><text x="153" y="531">Abdominal symptoms</text><text x="383" y="531">Pulmonary findings</text><text x="613" y="531">Catheter concern</text><text x="848" y="531">Skin lesions</text></g><g font-size="16"><text x="153" y="563">CT · Enterocolitis</text><text x="153" y="586">Support + broad therapy</text><text x="383" y="563">CT · Fungal workup</text><text x="383" y="586">BAL / biopsy as appropriate</text><text x="613" y="563">Paired cultures</text><text x="613" y="586">Source control when indicated</text><text x="848" y="563">Infection vs inflammation</text><text x="848" y="586">Biopsy / culture in context</text></g>
<text x="500" y="648" font-size="18" fill="#d2edf1">An ANC number alone does not establish safe outpatient eligibility.</text></g></svg>
