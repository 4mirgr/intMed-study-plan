<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 780" role="img" aria-labelledby="title desc">
  <title id="title">CML: diagnosis, response and treatment review</title><desc id="desc">Original educational pathway. Confirm disease, assess baseline phase, select TKI, monitor quantitative response and toxicity, then reassess inadequate response or intolerance.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="none" stroke="#56d6d7" stroke-width="2"/></marker></defs>
  <rect width="960" height="780" rx="28" fill="#0c2438"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="480" y="54" font-size="28" font-weight="bold" fill="#b7ffec">CML: a structured care pathway</text>
  <g fill="#163e54" stroke="#56d6d7" stroke-width="2"><rect x="160" y="88" width="640" height="80" rx="18"/><rect x="160" y="208" width="640" height="88" rx="18"/><rect x="160" y="336" width="640" height="80" rx="18"/><rect x="160" y="456" width="640" height="88" rx="18"/><rect x="40" y="600" width="270" height="110" rx="18"/><rect x="345" y="600" width="270" height="110" rx="18"/><rect x="650" y="600" width="270" height="110" rx="18"/></g>
  <g fill="#f1fbff" font-size="23"><text x="480" y="122">Clinical suspicion + blood morphology</text><text x="480" y="150" font-size="19">Myeloid left shift / basophilia / splenomegaly</text><text x="480" y="244">Confirm BCR::ABL1 + baseline marrow assessment</text><text x="480" y="274" font-size="19">Specify the classification used for disease phase</text><text x="480" y="384">Select an appropriate TKI with hematology</text><text x="480" y="492">Monitor quantitative response AND tolerability</text><text x="480" y="522" font-size="19">A positive PCR alone is not treatment failure</text><text x="175" y="640">Stable response</text><text x="175" y="675" font-size="18">Continue planned monitoring</text><text x="480" y="640">Inadequate response</text><text x="480" y="675" font-size="18">Check adherence / interactions</text><text x="480" y="699" font-size="18">Reassess phase / resistance</text><text x="785" y="640">Important toxicity</text><text x="785" y="675" font-size="18">Assess cause and severity</text><text x="785" y="699" font-size="18">Review the TKI strategy</text></g>
  <g stroke="#56d6d7" fill="none" stroke-width="3" marker-end="url(#arrow)"><path d="M480 168V202"/><path d="M480 296V330"/><path d="M480 416V450"/><path d="M480 544V570H175V594"/><path d="M480 544V594"/><path d="M480 570H785V594"/></g><text x="480" y="753" fill="#c0d6e3" font-size="17">Original IntMed teaching diagram - draft for teacher review - not a prescribing protocol</text></g>
</svg>
