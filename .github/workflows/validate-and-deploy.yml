name: Validate and deploy IntMed

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python3 scripts/content_pipeline.py migrate
      - name: Ensure migrations were committed
        run: git diff --exit-code
      - run: python3 scripts/content_pipeline.py validate
      - run: python3 scripts/content_pipeline.py check
      - run: node scripts/check_inline_js.mjs
      - run: node scripts/backend_unit_test.mjs
      - run: python3 scripts/runtime_config_test.py
      - run: python3 scripts/smoke_test.py
      - name: Browser smoke test
        run: |
          python3 -m http.server 8765 --directory docs &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node scripts/browser_smoke.mjs
      - name: Build secure production configuration
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          INTMED_SUPABASE_URL: ${{ vars.INTMED_SUPABASE_URL }}
          INTMED_SUPABASE_ANON_KEY: ${{ vars.INTMED_SUPABASE_ANON_KEY }}
        run: python3 scripts/write_runtime_config.py --allow-existing
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
