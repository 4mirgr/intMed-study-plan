name: Publish Approved Content

on:
  workflow_dispatch:
    inputs:
      draft_id:
        description: Reviewed draft UUID
        required: true
        type: string
      capability:
        description: Short-lived one-draft capability
        required: true
        type: string

permissions:
  contents: write

concurrency:
  # Database claim_intmed_publication serializes the real FIFO. A global GitHub
  # concurrency group retains only one pending run and can cancel older drafts.
  group: intmed-content-publisher-${{ inputs.draft_id }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mask publication capability
        run: |
          python3 - <<'PY'
          import json, os, re
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as handle:
              capability = json.load(handle).get("inputs", {}).get("capability", "")
          if not isinstance(capability, str) or not re.fullmatch(r"[0-9a-f]{64}", capability):
              raise SystemExit("Invalid publication capability.")
          masked = capability.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::add-mask::" + masked, flush=True)
          PY

      - uses: actions/checkout@v4
        with:
          ref: claude/quirky-ride-mavb6b
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validator
        run: python -m pip install --disable-pip-version-check 'jsonschema>=4.20,<5'

      - name: Publish reviewed draft
        env:
          INTMED_PUBLISH_ENDPOINT: https://upwbktvnybsjugdegjji.supabase.co/functions/v1/intmed-content-publisher
          INTMED_DRAFT_ID: ${{ inputs.draft_id }}
          INTMED_PUBLISH_CAPABILITY: ${{ inputs.capability }}
        run: python scripts/publish_reviewed_content.py
