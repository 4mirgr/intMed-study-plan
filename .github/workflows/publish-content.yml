name: Publish Approved Content

on:
  workflow_dispatch:
    inputs:
      draft_id:
        description: Reviewed draft UUID
        required: true
        type: string
      capability:
        description: Short-lived one-draft capability
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: intmed-content-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/quirky-ride-mavb6b
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validator
        run: python -m pip install --disable-pip-version-check 'jsonschema>=4.20,<5'

      - name: Publish reviewed draft
        env:
          INTMED_PUBLISH_ENDPOINT: https://upwbktvnybsjugdegjji.supabase.co/functions/v1/intmed-content-publisher
          INTMED_DRAFT_ID: ${{ inputs.draft_id }}
          INTMED_PUBLISH_CAPABILITY: ${{ inputs.capability }}
        run: |
          echo "::add-mask::$INTMED_PUBLISH_CAPABILITY"
          python scripts/publish_reviewed_content.py
