name: Publish Approved Content
on:
  workflow_dispatch:
    inputs:
      content_id:
        description: "شناسه محتوای تأییدشده"
        required: true
      target_topic:
        description: "مبحث مقصد (مثلاً cardiology)"
        required: true
      mode:
        description: "append | insert | image-gallery"
        required: true
        default: "append"
      position:
        description: "برای insert: شماره بخش یا کلید"
        required: false
      requested_by:
        description: "ادمین درخواست‌دهنده (برای audit)"
        required: true

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Verify approval state
        run: python3 scripts/verify_approved.py "${{ inputs.content_id }}"

      - name: Apply to content
        run: |
          python3 scripts/apply_published.py \
            --content-id "${{ inputs.content_id }}" \
            --topic "${{ inputs.target_topic }}" \
            --mode "${{ inputs.mode }}" \
            --position "${{ inputs.position }}"

      - name: Validate & Build
        run: |
          python3 scripts/content_pipeline.py validate
          python3 scripts/content_pipeline.py build
          python3 scripts/content_pipeline.py check

      - name: Commit & push
        run: |
          git config user.name  "intmed-publisher[bot]"
          git config user.email "publisher@intmed.local"
          git add content/ docs/
          git commit -m "publish: ${{ inputs.content_id }} → ${{ inputs.target_topic }} (${{ inputs.mode }}) by ${{ inputs.requested_by }}"
          git push

      - name: Deploy (reuses existing deploy workflow)
        run: echo "push triggers validate-and-deploy.yml"
