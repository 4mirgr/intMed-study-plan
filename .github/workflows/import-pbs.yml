name: Stage and import curated PBS images

on:
  push:
    branches: [claude/quirky-ride-mavb6b]
    paths:
      - content/_imports/pbs-open-license.json
      - scripts/import_pbs_images.py
      - .github/workflows/import-pbs.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: intmed-content-publisher
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/quirky-ride-mavb6b
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validator and JPEG verifier
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.26.0' 'Pillow==13.0.0'
      - name: Verify importer and existing canonical content
        run: |
          python -m unittest scripts/import_pbs_images_test.py
          python scripts/content_pipeline.py validate
      - name: Download curated originals and apply approved records only
        run: python scripts/import_pbs_images.py
      - name: Validate and regenerate site content
        run: |
          python scripts/content_pipeline.py validate
          python scripts/content_pipeline.py build
          python scripts/content_pipeline.py check
          python scripts/version_assets.py
      - name: Save reviewed import checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/heme docs/content docs/index.html docs/newsletter.html
          if git diff --cached --quiet; then
            echo 'Curated PBS assets and content are already current.'
          else
            git commit -m 'Stage curated open-license PBS originals and approved records'
            git push origin HEAD:claude/quirky-ride-mavb6b
          fi
