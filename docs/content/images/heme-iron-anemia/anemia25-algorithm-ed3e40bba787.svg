<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
<title id="title">Anemia and erythrocytosis: first decisions</title><desc id="desc">An original educational map: confirm CBC abnormality, use reticulocytes for anemia and oxygenation plus EPO for persistent erythrocytosis. Clinical interpretation and further testing remain necessary.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#082e46"/><stop offset="1" stop-color="#11546a"/></linearGradient><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#78ebdf"/></marker></defs>
<rect width="1000" height="650" rx="28" fill="url(#bg)"/>
<g font-family="Arial,sans-serif" fill="#efffff" text-anchor="middle"><text x="500" y="48" font-size="28" font-weight="bold">Start with the CBC — then choose the pathway</text><text x="500" y="78" font-size="17" fill="#b9dfe9">Original teaching map · Source-linked draft · Not a bedside order set</text>
<g stroke="#78ebdf" stroke-width="2" fill="#103f55"><rect x="55" y="115" width="410" height="75" rx="18"/><rect x="535" y="115" width="410" height="75" rx="18"/><rect x="55" y="245" width="190" height="90" rx="16"/><rect x="275" y="245" width="190" height="90" rx="16"/><rect x="535" y="245" width="410" height="90" rx="16"/><rect x="535" y="390" width="190" height="100" rx="16"/><rect x="755" y="390" width="190" height="100" rx="16"/></g>
<g font-size="21" font-weight="bold"><text x="260" y="147">LOW Hb / Hct</text><text x="740" y="147">PERSISTENT HIGH Hb / Hct</text></g><g font-size="17"><text x="260" y="174">Assess the absolute reticulocyte response</text><text x="740" y="174">Prior CBC · Volume status · Oxygenation</text><text x="150" y="280">High reticulocytes</text><text x="150" y="309">Blood loss / hemolysis</text><text x="370" y="280">Low / inadequate</text><text x="370" y="309">MCV + smear + iron</text><text x="740" y="281">Evaluate hypoxia and secondary causes</text><text x="740" y="311">Use EPO to guide targeted investigation</text><text x="630" y="427">Low / normal EPO</text><text x="630" y="458">JAK2 + PV assessment</text><text x="850" y="427">High EPO</text><text x="850" y="458">Secondary-cause workup</text></g>
<g stroke="#78ebdf" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M260 190V218H150V245"/><path d="M260 218H370V245"/><path d="M740 190V245"/><path d="M740 335V360H630V390"/><path d="M740 360H850V390"/></g>
<rect x="55" y="390" width="410" height="100" rx="16" fill="#205466" stroke="#5f9faf"/><g font-size="17"><text x="260" y="426">Normal MCV does not exclude iron deficiency</text><text x="260" y="457">Unexplained underproduction may need marrow review</text></g><path d="M370 335V390" stroke="#78ebdf" stroke-width="3" marker-end="url(#a)"/>
<g font-size="18" fill="#ccebf0"><text x="500" y="550">Normal pulse oximetry does not exclude carbon monoxide exposure.</text><text x="500" y="580">Corrected reticulocyte percentage is not automatically the classical RPI.</text><text x="500" y="610">Interpret every result in context; do not diagnose PV from one number alone.</text></g></g></svg>
