<!doctype html>
<html lang="fa" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f4c81">
<title>IntMed — بدون اتصال</title>
<style>
  :root{font-family:Vazirmatn,Tahoma,sans-serif;color:#13304b;background:#f6f2e9;color-scheme:light dark}
  body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;box-sizing:border-box}
  main{width:min(100%,520px);padding:28px;border:1px solid #9fcbd0;border-radius:24px;background:#fffdf8;box-shadow:0 18px 50px #163e5c20;text-align:center}
  img{width:88px;height:88px}h1{font-size:1.3rem}p{line-height:2;color:#526b7c}
  button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:12px 22px;background:#0f7d8a;color:white;cursor:pointer}
  @media(prefers-color-scheme:dark){:root{color:#e9f7f5;background:#0d1726}main{background:#162337;border-color:#285c68}p{color:#b8c9d1}}
</style>
<main>
  <img src="assets/logo.png" alt="">
  <h1>در حال حاضر به اینترنت دسترسی ندارید</h1>
  <p>برای ورود، همگام‌سازی حساب، پیام‌ها و محتوای شخصی اتصال امن به سرور لازم است. پس از وصل‌شدن اینترنت دوباره تلاش کنید.</p>
  <button type="button" onclick="location.reload()">تلاش دوباره</button>
</main>
</html>
